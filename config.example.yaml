# Copy to config.yaml or run setup-client.bat. Never commit config.yaml.
# Ask your server operator for the actual WebSocket address.
client:
  server_url: ws://127.0.0.1:8765/ws
  client_id: my-room
  workplace_name: Living room   # Displayed in Telegram; unique client_id per PC
  wakeword:
    word: rowan ai
    phrases: [rowan ai, rowan a i, roan ai, roan a i, rowen ai, rowen a i, rowanai]
    vosk_model: models/vosk-model-small-en-us-0.15
  audio:
    input_device: null
    output_device: null
    sample_rate: 16000
    echo_cancellation: false
    noise_suppression: false
    noise_suppression_level: 1
  vad:
    aggressiveness: 2
    silence_ms: 1100
    max_utterance_s: 25
    pre_roll_ms: 1500
    min_speech_ms: 250
  camera:
    enabled: false
    name: Main camera
    index: 0
    stream_url: null
    width: 1920
    height: 1080
    fps: 0                     # No software limit; processes fresh frames
    half: true
    model: yolo11n.pt           # Local Ultralytics detector; e.g. yolo11s.pt
    face_check_interval_s: 0.5
    auto_profile: false         # ТЗ F-312: автовыбор профиля по замеру при старте
    profile_measure_frames: 3
    profiles:                   # сильный → слабый; ФАЙЛ yolo11x.engine строит scripts/export_tensorrt.py
      tensorrt: {model: yolo11x.engine, fps: 20, half: true, budget_ms: 30}
      gpu: {model: yolo11x.pt, fps: 10, half: true, budget_ms: 90}
      weak: {model: yolo11s.pt, fps: 10, half: false, budget_ms: 200}
    frame_recording:
      enabled: false
      retention_days: 0
      max_gb: 0
      min_free_gb: 5
  overlay:
    enabled: true
    position: bottom_right
    idle_hidden: false
    scale: 1.0
  followup_window_s: 0
  attention_mode: wake_word
  thinking_sounds: true
  apps: {}
  devices: []
  # --- жизнь комнаты без хаба (ТЗ 4.8) ---
  offline:
    enabled: true
    after_s: 3                 # «потеря соединения дольше 3 с» — голос и HUD
    backoff_base_s: 1          # экспоненциальная задержка реконнекта: 1, 2, 4 …
    backoff_factor: 2
    backoff_max_s: 30
    stt:
      enabled: true
      model: base              # ТЗ 4.8: faster-whisper small (или base)
      device: auto
      compute_type: int8
      language: ""
      timeout_s: 20
    phrases_cache: true
    phrases_dir: data/tts_cache
    presence_buffer: 120
