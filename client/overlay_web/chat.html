<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Rowan · Your conversation</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;background:transparent;overflow:hidden}
body{font-family:Inter,"Segoe UI",sans-serif;color:#f1f1f5;font-size:18px;-webkit-font-smoothing:antialiased}
.shell{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:min(840px,78vw);height:min(750px,78vh);display:flex;flex-direction:column;background:linear-gradient(155deg,rgba(25,27,34,.98),rgba(13,15,21,.98));border:1px solid #353741;border-radius:26px;box-shadow:0 30px 100px #0008;opacity:0;transition:opacity .22s ease}
body.active .shell{opacity:1}header{display:flex;align-items:center;gap:14px;padding:23px 28px;border-bottom:1px solid #ffffff0f}
.mark{width:42px;height:42px;border-radius:14px;background:linear-gradient(145deg,#c2dcce,#809dba);color:#182124;display:grid;place-items:center;font-weight:700;font-size:24px}
.brand{font-size:20px;font-weight:600;letter-spacing:-.5px}.sub{color:#9296a6;font-size:12px;margin-top:4px;letter-spacing:.3px}.person{margin-left:auto;padding:8px 13px;background:#ffffff08;border:1px solid #ffffff13;border-radius:30px;color:#c5c8d1;font-size:13px}
main{overflow:auto;flex:1;padding:28px;scrollbar-width:thin;scrollbar-color:#414450 transparent}.message{max-width:94%;line-height:1.55;white-space:pre-wrap;overflow-wrap:anywhere;margin:0 0 25px;font-size:17px}.message.user{margin-left:auto;background:#2a2d37;border:1px solid #363944;border-radius:17px 17px 4px 17px;padding:14px 18px;max-width:82%}.message.assistant{padding:0 5px;color:#e2e4eb}.label{display:block;font-size:11px;color:#8e94a6;margin-bottom:7px;font-weight:600;letter-spacing:.6px;text-transform:uppercase}.time{font-size:11px;font-weight:400;color:#7c8292;margin-left:12px;text-transform:none;letter-spacing:0}
.empty{height:100%;display:flex;flex-direction:column;justify-content:center;align-items:center;color:#969cae;gap:13px}.empty strong{font-size:27px;font-weight:450;color:#eceef5;letter-spacing:-.6px}.empty span{font-size:14px}.footer{border-top:1px solid #ffffff0f;padding:18px 28px 22px;flex-shrink:0}.activity{display:flex;align-items:center;gap:10px;color:#b4c5bc;font-size:14px}.dot{width:7px;height:7px;background:#b8d8c5;border-radius:50%;box-shadow:0 0 15px #b8d8c544}.thinking .dot,.listening .dot{animation:pulse 1.4s ease infinite}.status{margin-top:10px;max-height:62px;overflow:auto;font-size:13px;line-height:1.5;color:#9199ac;white-space:pre-wrap}.sentence{margin-top:15px;padding:15px 18px;background:#b8d8c50b;border:1px solid #b8d8c532;border-radius:12px;line-height:1.6;font-size:18px;color:#e0f0e7}.sentence:empty,.status:empty{display:none}.badge{margin-left:auto;color:#747d8d;font-size:11px;letter-spacing:1.1px}.ring{position:absolute;width:40px;height:40px;border:2px solid #c0ded0;border-radius:50%;transform:translate(-50%,-50%);animation:ring .5s forwards} @keyframes pulse{50%{opacity:.3}}@keyframes ring{to{width:10px;height:10px;opacity:0}}
@media(min-width:2500px){.shell{width:1260px;height:1125px;border-radius:36px}header{padding:34px 42px}.brand{font-size:30px}.sub,.person{font-size:19px}main{padding:42px}.message{font-size:26px}.label,.time{font-size:16px}.footer{padding:27px 42px}.activity,.status{font-size:21px}.sentence{font-size:27px}.mark{width:63px;height:63px;font-size:36px}}
</style></head><body><section class="shell"><header><div class="mark">r</div><div><div class="brand">rowan</div><div class="sub">A conversation that stays with you</div></div><div class="person" id="person">Identifying voice…</div></header><main id="messages"></main><div class="footer"><div class="activity"><span class="dot"></span><span id="activity">Listening</span><span class="badge">YOUR ROOM ASSISTANT</span></div><div class="status" id="status"></div><div class="sentence" id="sentence"></div></div></section>
<script>
(()=>{'use strict';let state='idle',person='',steps=[],rows=[],readingUntil=0,selectionUntil=0;const $=id=>document.getElementById(id);const scroll=()=>{$('messages').scrollTop=$('messages').scrollHeight};
function message(role,text,ts){if(!text)return;const item=document.createElement('div');item.className='message '+role;if(role==='assistant'){const label=document.createElement('span');label.className='label';label.textContent='Rowan';if(ts){const date=new Date(ts);if(!Number.isNaN(date.getTime())){const time=document.createElement('span');time.className='time';time.textContent=date.toLocaleString([], {month:'short',day:'numeric',hour:'2-digit',minute:'2-digit'});label.append(time)}}item.append(label)}const content=document.createElement('span');content.textContent=text;item.append(content);$('messages').append(item)}
window.hudChat=function(p){if(!p.selection_active){const old=document.getElementById('selection-photo');if(old)old.remove()}person=p.person||'';rows=p.messages||[];steps=[];$('status').textContent='';$('sentence').textContent='';$('person').textContent=person||'New conversation';$('messages').replaceChildren();for(const row of rows){message('user',row.question);message('assistant',row.answer,row.ts)}message('user',p.question);if(!rows.length&&!p.question){const box=document.createElement('div');box.className='empty';const title=document.createElement('strong');title.textContent='I’m listening.';const sub=document.createElement('span');sub.textContent='Your conversation appears here.';box.append(title,sub);$('messages').append(box)}scroll()};
window.hudTranscript=function(p){let bubble=document.getElementById('live-utterance');if(p.ignored){if(bubble)bubble.remove();$('person').textContent='Rowan';return}if(!bubble){const empty=$('messages').querySelector('.empty');if(empty)empty.remove();bubble=document.createElement('div');bubble.id='live-utterance';bubble.className='message user';const label=document.createElement('span');label.className='label';bubble.append(label,document.createElement('span'));$('messages').append(bubble)}bubble.firstChild.textContent=p.provisional?(p.uncertain?'Checking overlapping or unclear speech…':'Listening · draft'):'You';bubble.lastChild.textContent=p.text||'';if(p.provisional){$('person').textContent=p.person?(p.person+' · checking'):'Identifying voice…'}scroll()};
window.hudImage=function(url){selectionUntil=Date.now()+90000;let img=document.getElementById('selection-photo');if(!img){img=document.createElement('img');img.id='selection-photo';img.style.cssText='width:100%;max-height:34vh;object-fit:contain;padding:15px 28px 0;border-radius:14px';document.querySelector('header').after(img)}img.src=url};
window.hudReply=function(p){message('assistant',p.text);$('sentence').textContent=p.sentence||'';readingUntil=p.sentence?Date.now()+180000:0;scroll()};
function resetForListening(){const sentence=Date.now()<readingUntil?$('sentence').textContent:'';window.hudChat({selection_active:Date.now()<selectionUntil});$('sentence').textContent=sentence}
window.hudState=function(p){const old=state;state=p.state||state;document.body.classList.toggle('active',state!=='idle'||!!p.status||p.scan||p.typing);document.body.classList.remove('thinking','listening','speaking','idle');document.body.classList.add(state);if(state==='listening'&&old!=='listening')resetForListening();$('activity').textContent=p.scan?'Looking at the screen':({idle:'Ready',listening:'Listening to you',thinking:'Working on your request',speaking:'Rowan is speaking'}[state]||'Working');if(p.status&&steps[steps.length-1]!==p.status){steps.push(p.status);steps=steps.slice(-4);$('status').textContent=steps.join('\n')}};
window.hudSpeaker=function(name){if(name)$('person').textContent=name};window.hudFlash=function(kind){if(kind==='wake')resetForListening();if(kind==='error'){$('activity').textContent='Something needs attention'}};window.hudClick=function(x,y){const ring=document.createElement('div');ring.className='ring';ring.style.left=(x*100)+'vw';ring.style.top=(y*100)+'vh';document.body.append(ring);setTimeout(()=>ring.remove(),550)};window.hudChat({});
})();
</script></body></html>
